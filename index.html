        :root{
          --green:#0E2F24;
          --green-2:#123D2F;
          --green-3:#1A4D3C;
          --copper:#C87D3A;
          --copper-2:#B06C30;
          --cream:#F8F5F0;
          --paper:#FFFCF8;
          --line: rgba(14,47,36,0.10);
          --line-2: rgba(14,47,36,0.14);
          --muted:#5E736E;
          --text:#12201C;
          --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }
        *{box-sizing:border-box}
        html{scroll-behavior:smooth; overflow-x:hidden}
        body{
          margin:0; background:var(--cream); color:var(--text);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          -webkit-font-smoothing:antialiased; overflow-x:hidden;
        }
        h1,h2,h3{font-family: Georgia, "Times New Roman", serif; font-weight:400; letter-spacing:-0.02em}
        button{font:inherit}
        a{color:inherit; text-decoration:none}
        .toast{
          position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
          background:var(--green); color:#fff; padding:10px 16px; border-radius:999px;
          font-size:12px; letter-spacing:0.04em; font-weight:600; z-index:99999;
          box-shadow:0 12px 30px rgba(0,0,0,0.22); display:flex; align-items:center; gap:8px;
          border:1px solid rgba(255,255,255,0.12); max-width:90vw; white-space:nowrap;
        }
        /* loader */
        .loader{
          position:fixed; inset:0; z-index:9999; background:var(--green);
          display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px;
        }
        .loader-logo{width:86px;height:86px;background:#fff;border-radius:20px;display:grid;place-items:center;box-shadow:0 20px 40px rgba(0,0,0,0.18)}
        .loader-logo img{width:64px;height:64px;object-fit:contain}
        .loader-bar{width:84px;height:2px;background:rgba(255,255,255,0.18);overflow:hidden;border-radius:999px;position:relative}
        .loader-bar i{display:block;height:100%;width:40%;background:var(--copper);animation:ld 1.1s infinite ease-in-out}
        @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
        /* nav */
        .nav{
          position:sticky; top:0; z-index:40; backdrop-filter:blur(16px);
          background:rgba(248,245,240,0.82); border-bottom:1px solid var(--line);
          padding-top:var(--safe-area-inset-top);
        }
        .nav-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
        .brand{display:flex;align-items:center;gap:12px}
        .brand-mark{width:42px;height:42px;border-radius:12px;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:0 2px 10px rgba(14,47,36,0.08);border:1px solid var(--line)}
        .brand-mark img{width:42px;height:42px;object-fit:contain;border-radius:12px;display:block}
        .brand-name{font-family: Georgia, serif;font-size:20px;letter-spacing:-0.01em;color:var(--green);line-height:1}
        .brand-sub{display:block;font-family: sans-serif;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--copper);font-weight:600;margin-top:2px}
        .nav-links{display:flex;gap:32px;align-items:center}
        .nav-links a{font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:500;position:relative;padding:4px 0}
        .nav-links a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--green);transition:width .35s ease}
        .nav-links a:hover{color:var(--green)} .nav-links a:hover::after{width:100%}
        .nav-cta{background:var(--green);color:#fff;border-radius:999px;padding:10px 18px;font-size:13px;letter-spacing:0.04em;font-weight:600;transition:transform .2s, background .2s;border:1px solid var(--green);cursor:pointer}
        .nav-cta:hover{background:var(--green-2);transform:translateY(-1px)}
        .hamb{display:none;width:42px;height:42px;border-radius:999px;border:1px solid var(--line-2);background:#fff;align-items:center;justify-content:center;gap:4px;flex-direction:column;cursor:pointer}
        .hamb span{display:block;width:16px;height:1.5px;background:var(--green);transition:all .3s}
        .hamb.open span:nth-child(1){transform:translateY(5.5px) rotate(45deg)} .hamb.open span:nth-child(2){opacity:0} .hamb.open span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}
        /* mobile menu */
        .menu-panel{position:fixed;inset:0;top:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;transform:translateX(100%);overflow-x:hidden;max-width:100vw}
        .menu-head{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
        .menu-body{padding:32px 24px;display:flex;flex-direction:column;gap:28px;flex:1}
        .m-link{font-family: Georgia, serif;font-size:42px;line-height:0.95;letter-spacing:-0.02em;color:var(--green)}
        .m-link small{display:block;font-family: sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--copper);margin-top:6px}
        /* hero */
        .hero{max-width:1240px;margin:0 auto;padding:28px 24px 24px;display:grid;grid-template-columns:1.08fr 0.92fr;gap:24px;align-items:stretch;overflow:hidden}
        .hero-left{background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:42px 36px 32px;position:relative;overflow:hidden;display:flex;flex-direction:column}
        .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--copper);font-weight:600;border:1px solid rgba(200,125,58,0.22);padding:6px 10px;border-radius:999px;background:rgba(200,125,58,0.06)}
        .eyebrow i{width:5px;height:5px;background:var(--copper);border-radius:50%;display:inline-block}
        .hero h1{font-size:clamp(42px,5.4vw,74px);line-height:0.92;margin:20px 0 14px;color:var(--green)}
        .hero h1 em{font-style:italic;color:var(--green-3)}
        .hero p{font-size:16px;line-height:1.7;color:var(--muted);max-width:44ch;margin:0}
        .hero-actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
        .btn-primary{background:var(--green);color:#fff;border-radius:999px;padding:14px 22px;display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:0.02em;border:1px solid var(--green);transition:transform .2s, background .2s;cursor:pointer}
        .btn-primary:hover{background:var(--green-2);transform:translateY(-1px)}
        .btn-primary:active{transform:translateY(0px) scale(0.98)}
        .btn-ghost{background:#fff;border:1px solid var(--line-2);color:var(--green);border-radius:999px;padding:14px 22px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .2s, transform .15s;cursor:pointer}
        .btn-ghost:hover{background:var(--cream)} .btn-ghost:active{transform:scale(0.98)}
        .hero-meta{padding-top:24px;display:flex;gap:22px;border-top:1px solid var(--line);margin-top:28px}
        .hero-meta b{font-family: Georgia, serif;font-size:28px;color:var(--green);font-weight:400;display:block;line-height:1}
        .hero-meta span{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)}
        /* hero art */
        .hero-art{position:relative;border-radius:28px;overflow:hidden;background:var(--green);border:1px solid var(--green);min-height:100%;display:grid;place-items:center;isolation:isolate;max-width:100%}
        .art-grid{position:absolute;inset:0;opacity:0.18;background-image:linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px);background-size:34px 34px;z-index:0;max-width:100%}
        .art-glow{position:absolute;width:360px;height:360px;max-width:90%;background:radial-gradient(closest-side, rgba(200,125,58,0.28), transparent 70%);left:-20px;top:-40px;z-index:0;filter:blur(6px)}
        .art-glow-2{position:absolute;width:320px;height:320px;max-width:80%;background:radial-gradient(closest-side, rgba(255,255,255,0.14), transparent 70%);right:-20px;bottom:-40px;z-index:0}
        .hero-art-card{position:relative;z-index:2;background:#fff;border-radius:26px;padding:22px;width:min(380px,84%);max-width:84%;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,0.22), 0 2px 0 rgba(255,255,255,0.6) inset; border:1px solid rgba(255,255,255,0.8)}
        .hero-art-card img{width:86%;height:auto;max-height:78%;object-fit:contain;display:block}
        .hero-art-card .art-label{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
        .hero-art-card .art-label i{width:6px;height:6px;background:var(--copper);border-radius:50%}
        .hero-art-foot{position:absolute;bottom:18px;left:18px;right:18px;z-index:3;display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,0.72);font-size:11px;letter-spacing:0.12em;text-transform:uppercase}
        .hero-art-foot b{color:#fff;font-weight:600}
        /* sections */
        .section{max-width:1240px;margin:0 auto;padding:84px 24px}
        .kicker{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--copper);font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:16px}
        .kicker::before{content:"";width:28px;height:1px;background:var(--copper);display:inline-block}
        .sec-head{display:grid;grid-template-columns:1.1fr 0.9fr;gap:24px;align-items:end;margin-bottom:36px}
        .sec-head h2{font-size:clamp(34px,4.2vw,56px);line-height:0.95;margin:0;color:var(--green)}
        .sec-head p{margin:0;color:var(--muted);line-height:1.7;font-size:15px}
        /* about */
        .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .about-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px}
        .about-card h3{font-size:24px;margin:0 0 10px;color:var(--green)}
        .about-card p{margin:0;color:var(--muted);line-height:1.7;font-size:14px}
        .about-highlight{background:var(--green);color:#E9EDEB;border-radius:20px;padding:26px;position:relative;overflow:hidden}
        .about-highlight h3{color:#fff;font-size:26px;margin:0 0 12px}
        .about-highlight p{color:rgba(255,255,255,0.78);line-height:1.7;margin:0;font-size:14px}
        .about-highlight::after{content:"";position:absolute;right:-30px;bottom:-30px;width:180px;height:180px;border-radius:50%;background:radial-gradient(closest-side, rgba(200,125,58,0.28), transparent)}
        /* product */
        .prod{display:grid;grid-template-columns:0.95fr 1.05fr;gap:18px;align-items:stretch}
        .prod-media{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;place-items:center;position:relative;overflow:hidden}
        .prod-media img{width:100%;max-width:420px;object-fit:contain;aspect-ratio:1/1}
        .prod-badge{position:absolute;left:18px;top:18px;background:var(--green);color:#fff;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:6px}
        .prod-badge i{width:6px;height:6px;background:var(--copper);border-radius:50%}
        .prod-info{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px}
        .prod-info h3{font-size:32px;margin:0;color:var(--green)}
        .prod-specs{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .spec{border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;background:var(--cream)}
        .spec label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
        .spec b{font-family: Georgia, serif;font-size:22px;color:var(--green);font-weight:400}
        .spec small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
        /* aplicações */
        .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
        .app{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px 18px;transition:transform .25s, border-color .25s}
        .app:hover{transform:translateY(-3px);border-color:var(--line-2)}
        .app-ic{width:40px;height:40px;border-radius:12px;background:var(--cream);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:14px;color:var(--green)}
        .app h4{font-family: sans-serif;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;margin:0 0 8px;color:var(--green)}
        .app p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
        /* processo */
        .process{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;overflow:hidden}
        .process-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative}
        .process-steps::before{content:"";position:absolute;top:34px;left:8%;right:8%;height:1px;background:linear-gradient(90deg, transparent, var(--line-2), transparent)}
        .step{position:relative}
        .step-num{width:38px;height:38px;border-radius:999px;background:var(--green);color:#fff;display:grid;place-items:center;font-family: Georgia, serif;font-size:18px;box-shadow:0 6px 16px rgba(14,47,36,0.18);margin-bottom:14px}
        .step:nth-child(2) .step-num{background:var(--cream);color:var(--green);border:1px solid var(--line-2)}
        .step:nth-child(3) .step-num{background:var(--cream);color:var(--green);border:1px solid var(--line-2)}
        .step:nth-child(4) .step-num{background:var(--copper)}
        .step h4{font-size:16px;margin:0 0 6px;color:var(--green);font-family: sans-serif;font-weight:700;letter-spacing:-0.01em}
        .step p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
        /* faq */
        .faq-wrap{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden}
        .faq-item{border-bottom:1px solid var(--line);padding:0 24px}
        .faq-item:last-child{border-bottom:none}
        .faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;background:none;border:none;cursor:pointer;text-align:left}
        .faq-q b{font-family: sans-serif;font-size:15px;font-weight:600;color:var(--green);line-height:1.4}
        .faq-q i{width:32px;height:32px;border-radius:999px;border:1px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;transition:transform .3s, background .3s, color .3s;background:#fff;color:var(--green)}
        .faq-item.open .faq-q i{background:var(--green);color:#fff;transform:rotate(45deg)}
        .faq-content{height:0;overflow:hidden;opacity:0}
        .faq-item.open .faq-content{opacity:1}
        .faq-content-inner{padding:0 0 22px;max-width:68ch;color:var(--muted);font-size:14px;line-height:1.7}
        /* contato */
        .contact{display:grid;grid-template-columns:0.9fr 1.1fr;gap:18px}
        .contact-side{background:var(--green);border-radius:24px;padding:28px;color:#E9EDEB;position:relative;overflow:hidden;display:flex;flex-direction:column}
        .contact-side h3{color:#fff;font-size:32px;margin:0 0 10px}
        .contact-side p{color:rgba(255,255,255,0.74);line-height:1.7;margin:0;font-size:14px}
        .contact-infos{margin-top:28px;display:flex;flex-direction:column;gap:14px}
        .cinfo{display:flex;gap:12px;align-items:flex-start}
        .cinfo-ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);display:grid;place-items:center;flex-shrink:0}
        .cinfo b{display:block;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#fff;margin-bottom:2px}
        .cinfo span{font-size:13px;color:rgba(255,255,255,0.72)}
        .contact-form{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:26px}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .field{display:flex;flex-direction:column;gap:6px}
        .field.full{grid-column:1 / -1}
        .field label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;font-weight:700;color:var(--green)}
        .field input,.field textarea{border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s, box-shadow .2s;width:100%}
        .field input:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(14,47,36,0.08)}
        .field textarea{resize:vertical;min-height:92px}
        .form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
        .form-foot small{color:var(--muted);font-size:11px;line-height:1.5;max-width:32ch}
        /* footer */
        .footer{border-top:1px solid var(--line);background:var(--paper);margin-top:24px}
        .footer-inner{max-width:1240px;margin:0 auto;padding:26px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
        .foot-left{display:flex;align-items:center;gap:14px}
        .foot-left img{width:36px;height:36px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line)}
        .foot-left b{font-family: Georgia, serif;font-size:18px;color:var(--green);font-weight:400}
        .foot-right{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
        .foot-right img{width:28px;height:28px;object-fit:contain;display:block}
        @media (max-width: 960px){
          .nav-links{display:none} .hamb{display:flex}
          .hero{grid-template-columns:1fr; padding-top:18px; gap:16px}
          .hero-art{min-height:360px; max-width:100vw}
          .sec-head{grid-template-columns:1fr}
          .about-grid{grid-template-columns:1fr}
          .prod{grid-template-columns:1fr}
          .apps{grid-template-columns:1fr 1fr}
          .process-steps{grid-template-columns:1fr 1fr}
          .process-steps::before{display:none}
          .contact{grid-template-columns:1fr}
          .form-grid{grid-template-columns:1fr}
        }
        @media (max-width: 560px){
          .nav-inner{padding:12px 16px}
          .section{padding:56px 16px}
          .hero{padding:16px 16px 0; max-width:100vw}
          .hero-left{padding:28px 22px 22px;border-radius:22px}
          .hero h1{font-size:40px}
          .hero-meta{gap:16px; flex-wrap:wrap}
          .apps{grid-template-columns:1fr}
          .process-steps{grid-template-columns:1fr}
          .footer-inner{padding:20px 16px}
          .m-link{font-size:34px}
        }
